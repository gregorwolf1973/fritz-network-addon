name: Build
on:
  push:
    branches: [main]
    paths: ["fritzbox_metrics/**", "fritzbox_network/**"]
  workflow_dispatch:
jobs:
  fritzbox_metrics:
    permissions: {contents: read, packages: write}
    uses: gregorwolf1973/ha-addons/.github/workflows/build-addon.yaml@main
    with:
      addon: "fritzbox_metrics"
      image: "ghcr.io/gregorwolf1973/{arch}-addon-fritzbox_metrics"
  fritzbox_network:
    permissions: {contents: read, packages: write}
    uses: gregorwolf1973/ha-addons/.github/workflows/build-addon.yaml@main
    with:
      addon: "fritzbox_network"
      image: "ghcr.io/gregorwolf1973/{arch}-addon-fritzbox_network"
