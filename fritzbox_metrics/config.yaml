name: "FritzBox & HA Metrics Exporter"
description: "Pushes FritzBox (TR-064) and Home Assistant metrics to InfluxDB 2.x"
version: "0.2.0"
url: "https://github.com/gregorwolf1973/fritz-network-addon"
slug: "fritzbox_metrics"
init: false
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
host_network: true
hassio_api: true
hassio_role: manager
homeassistant_api: true
options:
  fritzbox_host: "192.168.178.1"
  fritzbox_port: 49000
  fritzbox_user: ""
  fritzbox_password: ""
  influxdb_url: "http://a0d7b954-influxdb:8086"
  influxdb_token: ""
  influxdb_org: "homeassistant"
  influxdb_bucket: "metrics"
  scrape_interval: 15
  enable_fritzbox: true
  enable_homeassistant: true
  log_level: "info"
schema:
  fritzbox_host: str
  fritzbox_port: port
  fritzbox_user: str
  fritzbox_password: str
  influxdb_url: str
  influxdb_token: str
  influxdb_org: str
  influxdb_bucket: str
  scrape_interval: int(5,3600)
  enable_fritzbox: bool
  enable_homeassistant: bool
  log_level: list(debug|info|warning|error)
